name: Update Supporters List

on:
  schedule:
    - cron: '0 0 * * *'   # runs daily at midnight UTC
  workflow_dispatch:      # allows manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: K-S-C/.github
          token: ${{ secrets.ORG_ADMIN_PAT }}  # needed to push changes

      - name: Fetch Supporters and generate list
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_PAT }}
          ORG: K-S-C
        run: |
          # Build the new supporters list as markdown
          echo "<!-- SUPPORTERS_LIST_START -->" > supporters.md
          echo "" >> supporters.md
          echo "**Current Supporters:**" >> supporters.md
          echo "" >> supporters.md
          
          # Fetch all members of the 'supporters' team
          gh api orgs/$ORG/teams/supporters/members --paginate --jq '.[].login' | while read user; do
            echo "- [@$user](https://github.com/$user)" >> supporters.md
          done
          
          echo "" >> supporters.md
          echo "<!-- SUPPORTERS_LIST_END -->" >> supporters.md

      - name: Replace supporters section in README
        run: |
          # Ensure profile/README.md exists
          if [ ! -f profile/README.md ]; then
            echo "profile/README.md not found. Creating one."
            mkdir -p profile
            echo "# K Software Community" > profile/README.md
            echo "" >> profile/README.md
            echo "<!-- SUPPORTERS_LIST_START -->" >> profile/README.md
            echo "<!-- SUPPORTERS_LIST_END -->" >> profile/README.md
          fi
          
          # Use awk to replace the block between the markers
          awk '
            BEGIN { in_block = 0; printed = 0 }
            /<!-- SUPPORTERS_LIST_START -->/ {
              in_block = 1;
              print;
              # Insert the new content from supporters.md
              while ((getline line < "supporters.md") > 0) {
                if (line ~ /<!-- SUPPORTERS_LIST_START -->/ || line ~ /<!-- SUPPORTERS_LIST_END -->/) continue;
                print line;
              }
              printed = 1;
              next;
            }
            /<!-- SUPPORTERS_LIST_END -->/ {
              in_block = 0;
              print;
              next;
            }
            !in_block { print }
            END { if (!printed) print "<!-- SUPPORTERS_LIST_START -->\n<!-- SUPPORTERS_LIST_END -->" >> "profile/README.md" }
          ' profile/README.md > profile/README.tmp && mv profile/README.tmp profile/README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update supporters list [skip ci]"
            git push
          fi
