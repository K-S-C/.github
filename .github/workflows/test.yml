name: Test Bot Comment on All Open Issues

on:
  workflow_dispatch:  # manual trigger from the Actions tab

jobs:
  comment-on-open-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on every open issue
        env:
          GH_TOKEN: ${{ github.token }}   # explicitly use the built-in token
        run: |
          # Fetch all open issue numbers
          ISSUES=$(gh issue list --state open --json number --jq '.[].number')
          if [ -z "$ISSUES" ]; then
            echo "No open issues found."
            exit 0
          fi
          for issue in $ISSUES; do
            echo "Commenting on issue #$issue"
            gh issue comment $issue -b "🤖 This is a test comment from the GitHub Actions bot. (Triggered by manual workflow: ${{ github.workflow }})"
          done
