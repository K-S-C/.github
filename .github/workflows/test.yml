name: Test Bot Comment on All Open Issues

on:
  workflow_dispatch:

jobs:
  comment-on-open-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (to make it a Git repo)
        uses: actions/checkout@v4

      - name: Comment on every open issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          echo "Working on repository: $REPO"
          # List open issues
          ISSUES=$(gh issue list --state open --repo "$REPO" --json number --jq '.[].number')
          if [ -z "$ISSUES" ]; then
            echo "No open issues found."
            exit 0
          fi
          for issue in $ISSUES; do
            echo "Commenting on issue #$issue"
            gh issue comment "$issue" -b "🤖 This is a test comment from the GitHub Actions bot. (Triggered by manual workflow: ${{ github.workflow }})" --repo "$REPO"
          done
