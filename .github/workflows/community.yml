name: Auto-add Supporter & Update README

on:
  issues:
    types: [opened]

concurrency:
  group: supporter-request-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  process-request:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'membership-request')
    steps:
      - name: Extract username and role (robust)
        id: extract
        run: |
          BODY="${{ github.event.issue.body }}"
          USERNAME=$(echo "$BODY" | awk 'BEGIN{IGNORECASE=1} /Your GitHub Username/{getline; print}' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$USERNAME" ]; then
            USERNAME="${{ github.event.issue.user.login }}"
            echo "⚠️ Username not found, using issue author: $USERNAME"
          fi
          ROLE=$(echo "$BODY" | awk 'BEGIN{IGNORECASE=1} /Requested Role/{getline; print}' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$ROLE" ]; then
            ROLE="Contributor"
          fi
          echo "USERNAME=$USERNAME" >> $GITHUB_ENV
          echo "ROLE=$ROLE" >> $GITHUB_ENV

      - name: Debug extracted values
        run: |
          echo "USERNAME = '${{ env.USERNAME }}'"
          echo "ROLE = '${{ env.ROLE }}'"

      - name: Validate GitHub username (uses PAT)
        id: validate
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_PAT }}
        run: |
          if gh api users/${{ env.USERNAME }} --silent 2>/dev/null; then
            echo "VALID=true" >> $GITHUB_ENV
          else
            echo "VALID=false" >> $GITHUB_ENV
            echo "::error::User ${{ env.USERNAME }} does not exist on GitHub."
          fi

      - name: Check if role contains "Supporter"
        run: |
          ROLE_LOWER=$(echo "${{ env.ROLE }}" | tr '[:upper:]' '[:lower:]')
          if [[ "$ROLE_LOWER" == *"supporter"* ]]; then
            echo "IS_SUPPORTER=true" >> $GITHUB_ENV
          else
            echo "IS_SUPPORTER=false" >> $GITHUB_ENV
          fi

      # ========== INVALID USERNAME ==========
      - name: Comment and close if username is invalid
        if: env.VALID == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment $ISSUE -b "❌ The GitHub username **${{ env.USERNAME }}** does not exist." --repo $REPO
          gh issue close $ISSUE -c "Invalid username." --repo $REPO

      # ========== SUPPORTER PATH ==========
      - name: Check if already in supporters team
        if: env.VALID == 'true' && env.IS_SUPPORTER == 'true'
        id: check_member
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_PAT }}
          ORG: K-S-C
          USER: ${{ env.USERNAME }}
        run: |
          if gh api orgs/$ORG/teams/supporters/memberships/$USER --silent 2>/dev/null; then
            echo "ALREADY_MEMBER=true" >> $GITHUB_ENV
          else
            echo "ALREADY_MEMBER=false" >> $GITHUB_ENV
          fi

      - name: Add user to supporters team (uses PAT)
        if: env.VALID == 'true' && env.IS_SUPPORTER == 'true' && env.ALREADY_MEMBER == 'false'
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_PAT }}
          ORG: K-S-C
          USER: ${{ env.USERNAME }}
        run: |
          gh api orgs/$ORG/teams/supporters/memberships/$USER -X PUT -f role=member

      - name: Checkout .github repo (uses PAT)
        if: env.VALID == 'true' && env.IS_SUPPORTER == 'true' && env.ALREADY_MEMBER == 'false'
        uses: actions/checkout@v4
        with:
          repository: K-S-C/.github
          token: ${{ secrets.ORG_ADMIN_PAT }}
          path: .github_repo

      - name: Generate updated supporters list
        if: env.VALID == 'true' && env.IS_SUPPORTER == 'true' && env.ALREADY_MEMBER == 'false'
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_PAT }}
          ORG: K-S-C
        run: |
          cd .github_repo
          mkdir -p profile
          echo "<!-- SUPPORTERS_LIST_START -->" > supporters.md
          echo "" >> supporters.md
          echo "**Current Supporters:**" >> supporters.md
          echo "" >> supporters.md
          gh api orgs/$ORG/teams/supporters/members --paginate --jq '.[].login' | while read user; do
            echo "- [@$user](https://github.com/$user)" >> supporters.md
          done
          echo "" >> supporters.md
          echo "<!-- SUPPORTERS_LIST_END -->" >> supporters.md

      - name: Replace supporters section in profile/README.md
        if: env.VALID == 'true' && env.IS_SUPPORTER == 'true' && env.ALREADY_MEMBER == 'false'
        run: |
          cd .github_repo
          if [ ! -f profile/README.md ]; then
            echo "# K Software Community" > profile/README.md
            echo "" >> profile/README.md
            echo "<!-- SUPPORTERS_LIST_START -->" >> profile/README.md
            echo "<!-- SUPPORTERS_LIST_END -->" >> profile/README.md
          fi
          awk '
            BEGIN { in_block = 0; printed = 0 }
            /<!-- SUPPORTERS_LIST_START -->/ {
              in_block = 1;
              print;
              while ((getline line < "supporters.md") > 0) {
                if (line ~ /<!-- SUPPORTERS_LIST_START -->/ || line ~ /<!-- SUPPORTERS_LIST_END -->/) continue;
                print line;
              }
              printed = 1;
              next;
            }
            /<!-- SUPPORTERS_LIST_END -->/ {
              in_block = 0;
              print;
              next;
            }
            !in_block { print }
          ' profile/README.md > profile/README.tmp && mv profile/README.tmp profile/README.md

      - name: Commit and push updated README (uses PAT)
        if: env.VALID == 'true' && env.IS_SUPPORTER == 'true' && env.ALREADY_MEMBER == 'false'
        run: |
          cd .github_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: add supporter ${{ env.USERNAME }} [skip ci]"
            git push
          fi

      # ========== SUPPORTER: ADD LABEL, COMMENT, CLOSE ==========
      - name: Add 'approved' label to the issue (Supporter)
        if: env.VALID == 'true' && env.IS_SUPPORTER == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit $ISSUE --add-label "approved" --repo $REPO

      - name: Comment and close the issue (Supporter)
        if: env.VALID == 'true' && env.IS_SUPPORTER == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          USER: ${{ env.USERNAME }}
        run: |
          if [[ "${{ env.ALREADY_MEMBER }}" == "true" ]]; then
            msg="ℹ️ @$USER is already a Supporter. The README was not updated (no change needed)."
          else
            msg="🎉 Congratulations @$USER! You have been automatically added as a **Supporter** and are now listed in our [community README](https://github.com/K-S-C/.github/blob/main/profile/README.md). Welcome to the K Software Community! 🚀"
          fi
          gh issue comment $ISSUE -b "$msg" --repo $REPO
          gh issue close $ISSUE -c "Auto-approved and added." --repo $REPO

      # ========== NON-SUPPORTER PATH ==========
      - name: Mark for manual review (Contributor / Maintainer)
        if: env.VALID == 'true' && env.IS_SUPPORTER == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit $ISSUE --add-label "needs-manual-review" --repo $REPO
          gh issue comment $ISSUE -b "📋 Thank you for your request. A maintainer will manually review your application and add you to the appropriate team. Please be patient." --repo $REPO
